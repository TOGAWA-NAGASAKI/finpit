[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finpit"
version = "0.1.0"
description = "Point-in-time, leakage-audited evaluation of LLM-derived financial signals"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HaoWen Zhao", email = "3269942178@qq.com" }]
keywords = ["finance", "llm", "point-in-time", "lookahead-bias", "evaluation", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
finpit = "finpit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finpit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
